<style>
/* =====================================================================
   landing-desktop.html - hero (#s01 .lp) layer
   2026-10-22 redesign: time.fyi-style light editorial layout.
   Injected by scripts/build-landing.cjs AFTER landing-below.html, so these
   rules win over the base hero rules in _parts/index.html.part01.
   The hero markup itself (part02) is NOT touched - CSS only.

   Type rules for Korean (Pretendard):
   - Latin display faces run line-height ~1.05 and tracking -0.05em.
     Hangul is taller and denser; at those values syllables collide.
     Display: lh 1.18-1.24, tracking -0.03 to -0.035em.
   - Body: lh 1.7, tracking ~-0.01em. Weights 400/500/600/700 only (no 800).
   ===================================================================== */

/* ---------- tokens (scoped to the landing screen) ---------- */
#s01{
  --lx-ink:#141414;
  --lx-ink2:rgba(20,20,20,.70);
  --lx-ink3:rgba(20,20,20,.60);
  --lx-line:rgba(20,20,20,.08);
  --lx-line2:rgba(20,20,20,.13);
  --lx-fill:rgba(20,20,20,.05);
  --lx-pri:#163300;
  --lx-acc:#2F7A1F;
  --lx-lime:#9FE870;
  --lx-mark:rgba(159,232,112,.6);
  --lx-mono:ui-monospace,'SF Mono',SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;
  background:#fff;
  color:var(--lx-ink);
  letter-spacing:-.01em;
  font-feature-settings:'tnum' 0;
}
body,#s01{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
#s01 .scroll{overflow-x:hidden}

/* ---------- hero shell ---------- */
#s01 .lp{
  display:flex;flex-direction:column;
  min-height:auto;
  padding:0 20px calc(env(safe-area-inset-bottom) + 44px);
  color:var(--lx-ink);
  overflow:visible;
}
#s01 .lp::before{display:none}
#s01 .lp-hero{display:contents}

/* ---------- top bar ---------- */
#s01 .lp-top{
  order:0;position:relative;
  height:calc(56px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 20px 0;
  margin:0 -20px;
  border-bottom:1px solid var(--lx-line);
}
#s01 .lp-brand img{height:22px}
#s01 .lp-live{
  gap:7px;height:28px;padding:0 11px;
  font-size:12.5px;font-weight:500;letter-spacing:-.005em;line-height:1;
  color:var(--lx-ink2);background:#fff;
  border:1px solid var(--lx-line2);border-radius:999px;
}
#s01 .lp-live i{animation:none;width:6px;height:6px;background:#3A9A2A;box-shadow:0 0 0 3px rgba(58,154,42,.14)}

/* ---------- headline block ---------- */
#s01 .lp-eyebrow{
  order:1;margin-top:44px;
  font-size:14px;font-weight:600;line-height:1.4;letter-spacing:-.005em;
  color:var(--lx-acc);
}
#s01 .lp-h1{
  order:2;margin-top:12px;
  font-size:34px;font-weight:700;line-height:1.24;letter-spacing:-.032em;
  color:var(--lx-ink);word-break:keep-all;
}
#s01 .lp-h1 .hl{
  color:inherit;
  background:linear-gradient(transparent 60%,var(--lx-mark) 60%,var(--lx-mark) 90%,transparent 90%);
  -webkit-box-decoration-break:clone;box-decoration-break:clone;
  padding:0 .04em;
}
#s01 .lp-sub{
  order:3;margin-top:16px;
  font-size:16px;line-height:1.7;letter-spacing:-.012em;
  color:var(--lx-ink2);word-break:keep-all;text-wrap:pretty;
}
#s01 .lp-sub b{color:var(--lx-ink);font-weight:600;white-space:nowrap}

/* ---------- CTA ---------- */
#s01 .lp-cta-wrap{order:4;margin-top:28px;text-align:center}
#s01 .lp-cta{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:54px;padding:0 24px;
  background:var(--lx-pri);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:-.012em;
  border-radius:999px;box-shadow:none;animation:none;
  transition:opacity .15s ease,transform .15s ease;
}
#s01 .lp-cta::after{content:'\2192';margin-left:8px;transition:transform .2s ease}
#s01 .lp-cta:hover{opacity:.9}
#s01 .lp-cta:hover::after{transform:translateX(2px)}
#s01 .lp-cta:active{transform:scale(.98)}
#s01 .lp-resume{
  width:100%;height:50px;margin-top:8px;padding:0 20px;
  background:var(--lx-fill);border:0;color:var(--lx-ink);
  font-size:15px;font-weight:600;letter-spacing:-.01em;border-radius:999px;
}
#s01 .lp-micro{
  margin-top:14px;
  font-size:13px;line-height:1.6;letter-spacing:-.005em;
  color:var(--lx-ink3);
}
#s01 .lp-blog{
  display:inline-block;margin-top:14px;padding:0;border:0;
  font-size:14px;font-weight:500;letter-spacing:-.01em;
  color:var(--lx-ink2);
  text-decoration:underline;text-decoration-color:var(--lx-line2);
  text-underline-offset:4px;
}
#s01 .lp-blog:hover{color:var(--lx-ink);text-decoration-color:currentColor}

/* ---------- three steps: hairline grid ---------- */
#s01 .lp-steps{
  order:5;margin-top:36px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--lx-line);border:1px solid var(--lx-line);
  border-radius:14px;overflow:hidden;
  counter-reset:lpstep;
}
#s01 .lp-steps div{
  background:#fff;border:0;border-radius:0;
  padding:14px 12px 16px;text-align:left;
  font-size:12.5px;line-height:1.5;letter-spacing:-.01em;
  color:var(--lx-ink2);word-break:keep-all;
}
#s01 .lp-steps div::before{
  counter-increment:lpstep;content:'0' counter(lpstep);
  display:block;margin-bottom:10px;
  font-family:var(--lx-mono);font-size:11px;font-weight:500;letter-spacing:.04em;
  color:var(--lx-ink3);
}
#s01 .lp-steps b{display:block;margin-bottom:3px;font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--lx-ink)}

/* =====================================================================
   >= 768px : full-bleed page with a 1080px ruled column
   ===================================================================== */
@media (min-width:768px){
  #frame:has(#s01.on) .lp{
    max-width:1080px;margin:0 auto;
    padding:0 40px 0;
    border-left:1px solid var(--lx-line);border-right:1px solid var(--lx-line);
  }
  #frame:has(#s01.on) .lp-top{height:64px;margin:0 -40px;padding:0 40px;border-bottom:0}
  #frame:has(#s01.on) .lp-top::after{
    content:'';position:absolute;left:50%;bottom:0;
    width:100vw;height:1px;background:var(--lx-line);transform:translateX(-50%);
  }
  #frame:has(#s01.on) .lp-brand img{height:24px}
  #frame:has(#s01.on) .lp-eyebrow{margin-top:88px;font-size:15px}
  #frame:has(#s01.on) .lp-h1{margin-top:16px;font-size:52px;line-height:1.2;letter-spacing:-.035em}
  #frame:has(#s01.on) .lp-sub{margin-top:24px;font-size:18px;line-height:1.72;max-width:540px}
  #frame:has(#s01.on) .lp-cta-wrap{margin-top:32px;max-width:360px;text-align:left}
  #frame:has(#s01.on) .lp-micro{text-align:left}
  #frame:has(#s01.on) .lp-steps{margin:64px -40px 0;border:0;border-top:1px solid var(--lx-line);border-radius:0}
  #frame:has(#s01.on) .lp-steps div{padding:28px 32px 32px;font-size:15px;line-height:1.55}
  #frame:has(#s01.on) .lp-steps div::before{margin-bottom:16px;font-size:12px}
  #frame:has(#s01.on) .lp-steps b{font-size:18px;margin-bottom:6px}
}

/* =====================================================================
   >= 1024px : headline full width, sub + CTA share one row
   ===================================================================== */
@media (min-width:1024px){
  #frame:has(#s01.on) .lp{
    display:grid;
    grid-template-columns:minmax(0,1fr) 340px;
    column-gap:64px;
    align-items:start;
  }
  #frame:has(#s01.on) .lp-top{grid-column:1/-1;grid-row:1;align-self:start}
  #frame:has(#s01.on) .lp-eyebrow{grid-column:1/-1;grid-row:2;align-self:start;margin-top:104px}
  #frame:has(#s01.on) .lp-h1{grid-column:1/-1;grid-row:3;align-self:start;font-size:64px;line-height:1.18}
  #frame:has(#s01.on) .lp-sub{grid-column:1;grid-row:4;margin-top:40px}
  #frame:has(#s01.on) .lp-cta-wrap{grid-column:2;grid-row:4;margin-top:40px;max-width:none}
  #frame:has(#s01.on) .lp-steps{grid-column:1/-1;grid-row:5;margin-top:80px}
  #frame:has(#s01.on) .lp-steps div{padding:32px 40px 36px}
  #frame:has(#s01.on) .lp-foot{grid-column:1/-1;grid-row:6}
}
@media (min-width:1440px){
  #frame:has(#s01.on) .lp-h1{font-size:72px}
}
</style>
