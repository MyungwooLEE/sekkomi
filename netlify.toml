# 세꼼 — Netlify 배포 설정
# 정적 사이트(프로토타입 HTML) + 서버리스 함수(이메일)를 한 폴더에서 배포.

[build]
  publish = "public"          # index.html 등 정적 파일 위치
  functions = "netlify/functions"
  # _parts/에 조각이 있으면 빌드 시 index.html을 조립한다 (자동화 도구의 대용량 커밋 한도 우회).
  # 체크섬이 안 맞으면 빌드가 실패해 기존 배포가 유지된다(안전). 검증용 사본을 build-index.sha256로 공개.
  # 이어서 블로그 featured(히어로) 카드를 시리즈 그리드 최신글로 자동 동기화한다.
  # 이어서 build-seo-meta가 디스커버용 robots 메타·RSS 링크·글 전용 OG 이미지를 주입하고,
  # llms.txt와 rss.xml을 ItemList 기준으로 자동 재생성한다(전부 실패해도 빌드는 계속 — || true).
  command = "if [ -f _parts/index.sha256 ]; then cat _parts/index.html.part* > public/index.html && echo \"$(cat _parts/index.sha256)  public/index.html\" | sha256sum -c - && cp _parts/index.sha256 public/build-index.sha256; fi && node scripts/build-blog-featured.cjs && (node scripts/build-seo-meta.cjs || true) && (node scripts/build-llms-txt.cjs || true) && (node scripts/build-rss.cjs || true)"
  # 빌드 스킵 규칙 (2026-08-05, 크레딧 절약): 사이트 산출물에 영향 없는 커밋(tools/·claude/ 문서만 변경 등)은 빌드를 생략한다.
  # 아래 경로에 변경이 있을 때만 빌드. (스크립트 exit 0 = 빌드 스킵, exit 1 = 빌드 진행)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml scripts _parts package.json"

[functions]
  node_bundler = "esbuild"    # @netlify/blobs import 번들링

# 어드민 로그인 페이지 (예쁜 URL)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# 함수 호출 경로 단축 (선택): /api/send-email → 실제 /.netlify/functions/send-email
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/verify-otp"
  to = "/.netlify/functions/verify-otp"
