# 세꼼 — Netlify 배포 설정
# 정적 사이트(프로토타입 HTML) + 서버리스 함수(이메일)를 한 폴더에서 배포.

[build]
  publish = "public"          # index.html 등 정적 파일 위치
  functions = "netlify/functions"
  # _parts/에 조각이 있으면 빌드 시 index.html을 조립한다 (자동화 도구의 대용량 커밋 한도 우회).
  # 체크섬이 안 맞으면 빌드가 실패해 기존 배포가 유지된다(안전). 검증용 사본을 build-index.sha256로 공개.
  # 이어서 블로그 featured(히어로) 카드를 시리즈 그리드 최신글로 자동 동기화한다.
  # 이어서 build-seo-meta가 디스커버용 robots 메타·RSS 링크·글 전용 OG 이미지를 주입하고,
  # llms.txt와 rss.xml을 ItemList 기준으로 자동 재생성한다(전부 실패해도 빌드는 계속 — || true).
  # 마지막으로 build-landing이 랜딩 하단 색인·전환 섹션과 블로그 계산기 배너를 주입한다
  # (본체 조각 _parts/index.html.part*는 무변경 — 조립 결과물에만 주입).
  command = "if [ -f _parts/index.sha256 ]; then cat _parts/index.html.part* > public/index.html && echo \"$(cat _parts/index.sha256)  public/index.html\" | sha256sum -c - && cp _parts/index.sha256 public/build-index.sha256; fi && node scripts/build-blog-featured.cjs && (node scripts/build-seo-meta.cjs || true) && (node scripts/build-llms-txt.cjs || true) && (node scripts/build-rss.cjs || true) && (node scripts/build-landing.cjs || true)"
  # 빌드 스킵 규칙 (2026-08-05, 크레딧 절약): 사이트 산출물에 영향 없는 커밋(tools/·claude/ 문서만 변경 등)은 빌드를 생략한다.
  # 아래 경로에 변경이 있을 때만 빌드. (스크립트 exit 0 = 빌드 스킵, exit 1 = 빌드 진행)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml scripts _parts package.json"

[functions]
  node_bundler = "esbuild"    # @netlify/blobs import 번들링

# 어드민 로그인 페이지 (예쁜 URL)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# 초기 수동 업로드 잔재 폴더 차단 (2026-08-13)
# public/sekkomi_calc_update/ 와 public/sekkomi_deploy_with_logo/ 에 계산기·블로그 전체 사본이
# 남아 있었다. robots 허용 + canonical 없음이라 홈과 같은 키워드로 색인될 수 있는 중복 콘텐츠였다.
# force=true 라 정적 파일보다 먼저 평가되어 실제로 서빙되지 않는다. 301이라 누적 신호는 정본으로 넘어간다.
# 파일 자체 삭제는 별도 과제(폴더 26개 파일).
[[redirects]]
  from = "/sekkomi_deploy_with_logo/blog/*"
  to = "/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/sekkomi_deploy_with_logo/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sekkomi_calc_update/*"
  to = "/"
  status = 301
  force = true

# 함수 호출 경로 단축 (선택): /api/send-email → 실제 /.netlify/functions/send-email
[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200

[[redirects]]
  from = "/api/verify-otp"
  to = "/.netlify/functions/verify-otp"
  status = 200

[[redirects]]
  from = "/api/save-lead"
  to = "/.netlify/functions/save-lead"
  status = 200

[[redirects]]
  from = "/api/list-leads"
  to = "/.netlify/functions/list-leads"
  status = 200

[[redirects]]
  from = "/api/delete-leads"
  to = "/.netlify/functions/delete-leads"
  status = 200

[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/api/sims"
  to = "/.netlify/functions/sims"
  status = 200

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
